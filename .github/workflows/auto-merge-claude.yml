name: Auto-PR and merge for Claude Code
on:
  push:
    branches:
      - "claude/**"
permissions:
  contents: write
  pull-requests: write
jobs:
  create-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or find PR and prepare for merge
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Branch: $BRANCH"

          # 1. Pruefen ob Branch noch existiert
          if ! git ls-remote --exit-code origin "$BRANCH" > /dev/null 2>&1; then
            echo "Branch $BRANCH existiert nicht mehr - Workflow beendet."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Bereits in main enthalten? -> sauber abbrechen
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "Branch bereits in main enthalten - nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Offene PR suchen
          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url' 2>/dev/null || echo "")

          # 4. Keine offene PR -> neue erstellen
          if [ -z "$PR_URL" ]; then
            echo "Erstelle neue PR..."
            CREATE_OUT=$(gh pr create \
              --title "Auto: $BRANCH" \
              --body "Auto-created by workflow" \
              --base main \
              --head "$BRANCH" 2>&1) || true
            if echo "$CREATE_OUT" | grep -q "https://"; then
              PR_URL=$(echo "$CREATE_OUT" | grep -o "https://github.com[^ ]*")
              echo "PR erstellt: $PR_URL"
            else
              echo "PR create fehlgeschlagen oder kein Diff: $CREATE_OUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "Bestehende PR gefunden: $PR_URL"
          fi

          # 5. Branch auf aktuelles main rebasen (verhindert Divergenz durch Squash-Merges)
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          if git rebase origin/main; then
            git push --force-with-lease origin "$BRANCH" || true
            echo "Branch erfolgreich auf main rebased."
          else
            git rebase --abort
            echo "Rebase fehlgeschlagen - PR bleibt offen fuer manuelle Bearbeitung"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 6. Auf fremde Checks warten (max 10 Min)
          #
          # Nur Checks anderer Dienste, etwa Netlify. Der eigene Check-Run
          # dieses Jobs ist waehrend der gesamten Laufzeit IN_PROGRESS; wuerde
          # er mitgezaehlt, liefe die Schleife immer in den Timeout.
          EIGENE_CHECKS='create-and-merge'
          # Zustaende, die einen Merge verhindern. ACTION_REQUIRED gehoert dazu:
          # ein Lauf, der auf Freigabe wartet, meldet weder FAILURE noch einen
          # laufenden Zustand und galt vorher als bestanden.
          BLOCKIERT='FAILURE|CANCELLED|TIMED_OUT|STALE|STARTUP_FAILURE|ACTION_REQUIRED|ERROR'
          # Zustaende, bei denen weiter gewartet wird. NEUTRAL ist zulaessig,
          # weil Netlifys "Pages changed" diesen Zustand regulaer meldet.
          LAEUFT='PENDING|QUEUED|IN_PROGRESS|REQUESTED|WAITING|EXPECTED'

          echo "Warte auf fremde Checks..."
          for i in $(seq 1 20); do
            sleep 30
            STATUS=$(gh pr checks "$PR_URL" --json name,state \
              -q ".[] | select(.name != \"$EIGENE_CHECKS\") | .state" 2>/dev/null || echo "PENDING")
            echo "  Versuch $i: ${STATUS:-keine fremden Checks}"
            if echo "$STATUS" | grep -qE "$BLOCKIERT"; then
              echo "Check in blockierendem Zustand - PR bleibt offen fuer manuelle Bearbeitung"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! echo "$STATUS" | grep -qE "$LAEUFT"; then
              echo "Keine laufenden fremden Checks mehr."
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Timeout - Checks laufen noch. PR bleibt offen."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # Die Qualitaetstore laufen hier im Job, nicht als eigener CI-Lauf.
      # Grund: Von GITHUB_TOKEN ausgeloeste Ereignisse starten keine Workflows
      # (siehe GitHub-Doku zu automatic token authentication). Auf einem PR,
      # den dieser Workflow selbst anlegt, wuerde ci.yml also nie laufen.
      # Zusaetzlicher Vorteil: geprueft wird der Stand nach dem Rebase, also
      # genau der Commit, der gemergt wird.
      - name: pnpm einrichten
        if: ${{ steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.pr_url != '' }}
        uses: pnpm/action-setup@v5

      - name: Node einrichten
        if: ${{ steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.pr_url != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Abhaengigkeiten installieren
        if: ${{ steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.pr_url != '' }}
        run: pnpm install --frozen-lockfile

      - name: Qualitaetstore (Lint, Format, Typecheck, Test, Build)
        id: verify
        if: ${{ steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.pr_url != '' }}
        run: pnpm verify

      - name: Auto-merge Claude branches
        if: ${{ !startsWith(github.ref_name, 'claude/editorial-') && steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.pr_url != '' && steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL="${{ steps.prepare.outputs.pr_url }}"
          BRANCH="${{ github.ref_name }}"
          if gh pr merge --merge "$PR_URL" 2>&1; then
            echo "PR erfolgreich gemergt"
            git push origin --delete "$BRANCH" 2>/dev/null || true
          else
            echo "Merge fehlgeschlagen - PR bleibt offen fuer manuelle Bearbeitung"
            exit 0
          fi

      - name: Editorial-Branch — Auto-Merge übersprungen
        if: ${{ startsWith(github.ref_name, 'claude/editorial-') && steps.prepare.outputs.skip != 'true' && steps.prepare.outputs.pr_url != '' }}
        run: |
          echo "::notice::Editorial-Phase erkannt (claude/editorial-*) — Auto-Merge übersprungen. PR bleibt für Christas Visual-Review offen."
          echo "PR-Link: ${{ steps.prepare.outputs.pr_url }}"
