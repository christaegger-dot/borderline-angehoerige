name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PDF audit tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm prettier --check .

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Audit handout asset register
        run: pnpm audit:handout-assets

      - name: Build
        run: pnpm build

      - name: Audit P1 illustration evidence
        run: pnpm audit:p1-illustrations

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/public
          retention-days: 7
