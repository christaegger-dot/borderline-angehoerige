name: Standalone authoring verification
on:
  pull_request:
    paths:
      - 'authoring/**'
      - 'site/**'
      - '.github/workflows/verify-authoring.yml'
      - 'netlify.toml'
  workflow_dispatch:
jobs:
  build-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify gate mutations
        run: node authoring/tools/selftest.mjs
      - name: Produce site and verify all generated assets against committed release
        run: node authoring/tools/build.mjs --verify-site
      - name: Diagnose mismatch on failure
        if: failure()
        run: |
          diff -u site/index.html dist/site/index.html | head -90 || true
          diff -u site/404.html dist/site/404.html | head -65 || true
      - name: Install pinned browser test tooling
        run: |
          npm install --prefix /tmp/borderline-browser --no-package-lock playwright@1.64.0
          /tmp/borderline-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify all fixed search expectations under production headers
        env:
          PLAYWRIGHT_MODULE: /tmp/borderline-browser/node_modules/playwright
        run: node authoring/tools/suchtest.mjs site
      # N809-7: Der Layouttest laeuft sichtbar; seine bekannten Abweichungen blockieren nicht (Entscheid Christa Egger, 26.11.2026).
      # Er ist auf main derzeit rot (Sicherheitskarte auf kleinen Telefonen, Website-Review Punkt 2).
      # N829-2: Bekannte Abweichungen stehen in KNOWN_ISSUES in layouttest.cjs. Eine NEUE Abweichung oder ein
      # fehlendes ERGEBNIS.json laesst den Job im Berichtsschritt scheitern, damit sie auffaellt.
      # Sobald der Test gruen ist: continue-on-error entfernen, damit er ganz blockiert.
      - name: Layout test (Audit-04, incl. B2c) - known deviations do not block
        id: layouttest
        continue-on-error: true
        env:
          PLAYWRIGHT_MODULE: /tmp/borderline-browser/node_modules/playwright
        run: node authoring/tools/layouttest.cjs
      - name: Report layout test result (fails on new deviations)
        if: always() && steps.layouttest.outcome != 'skipped'
        env:
          LAYOUT_OUTCOME: ${{ steps.layouttest.outcome }}
        run: node authoring/tools/layouttest-report.cjs dist/audit04-layout/ERGEBNIS.json
  # Suchraster (Wiederaufbau der Suche; Auftrag Christa Egger, 26.11.2026: «ok, leg los!»; gehärtet nach der Nachprüfung
  # PR #849, Entscheid 27.11.2026: «Raster härten, dann r4-78»). Vergleicht die Suche des Pull Requests mit der Suche der
  # Basis. Ein verlorener oder verdrängter Sicherheitsabschnitt, Suizid nicht mehr zuoberst, der letzte Sicherheitsabschnitt
  # auf Rang 3 verloren, eine verlorene Anheftung, eine Anfrage ohne Treffer oder ein verlorener Sicherheitslink in der
  # Leermeldung lässt den Job scheitern, ausser der Fall steht begründet in authoring/tests/suchraster-ausnahmen.tsv.
  # N847-2: Das Raster läuft zweimal, einmal mit Werkzeug und Proben der Basis, einmal mit denen des Pull Requests.
  # Ein Pull Request kann das Raster also nicht über Werkzeug oder Proben abschwächen; seine Ausnahmen gelten in beiden
  # Läufen, und jede neue Ausnahme lässt den Job suchraster-ausnahmen scheitern.
  # N855-2: Diesen Workflow selbst führt GitHub aus dem Pull Request aus. Ein PR, der ihn ändert, könnte die Läufe
  # abschwächen, auch den Job suchraster-ausnahmen; jede Änderung unter .github/ lässt diesen Job scheitern. Eine grüne
  # CI ist eine Freigabe nach R34-P01 nur, wenn der PR nichts unter .github/ ändert (N855-10).
  # N847-8: Ein dritter Lauf vergleicht mit dem festen Stand r4-73 (3764d45) und blockiert nicht.
  # N855-1: Ein vierter Lauf prüft mit dem Selbsttest, dass das Werkzeug des PR jede bekannte Verschlechterung meldet.
  suchraster:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variante: [werkzeug-der-basis, werkzeug-des-pr, fester-bezug-r4-73, selbsttest]
    steps:
      - uses: actions/checkout@v4
      - name: Check out base (site, search grid tool and test data)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: suchraster-basis
          sparse-checkout: |
            site
            authoring/tools
            authoring/tests
      - name: Check out fixed reference r4-73
        if: ${{ matrix.variante == 'fester-bezug-r4-73' }}
        uses: actions/checkout@v4
        with:
          ref: 3764d45830d1f061617ef6bf89a47eaaa77c3dee
          path: suchraster-r4-73
          sparse-checkout: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tooling
        run: |
          npm install --prefix /tmp/borderline-browser --no-package-lock playwright@1.64.0
          /tmp/borderline-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Search grid with the base tool and base test data
        if: ${{ matrix.variante == 'werkzeug-der-basis' }}
        env:
          PLAYWRIGHT_MODULE: /tmp/borderline-browser/node_modules/playwright
        run: node suchraster-basis/authoring/tools/suchraster.mjs suchraster-basis/site site --ausnahmen=authoring/tests/suchraster-ausnahmen.tsv --titel="Suchraster mit Werkzeug und Proben der Basis" --ausgabe=dist/suchraster
      - name: Search grid with the tool and test data of the pull request
        if: ${{ matrix.variante == 'werkzeug-des-pr' }}
        env:
          PLAYWRIGHT_MODULE: /tmp/borderline-browser/node_modules/playwright
        run: node authoring/tools/suchraster.mjs suchraster-basis/site site --ungenutzt-scheitert --titel="Suchraster mit Werkzeug und Proben des Pull Requests" --ausgabe=dist/suchraster
      - name: Search grid against fixed reference r4-73 (report only, does not block)
        if: ${{ matrix.variante == 'fester-bezug-r4-73' }}
        env:
          PLAYWRIGHT_MODULE: /tmp/borderline-browser/node_modules/playwright
        run: node authoring/tools/suchraster.mjs suchraster-r4-73/site site --ausnahmen=keine --nur-bericht --titel="Saldo gegenüber dem festen Stand r4-73 (nur Bericht)" --ausgabe=dist/suchraster
      - name: Self-test of the search grid (every known degradation must be reported)
        if: ${{ matrix.variante == 'selbsttest' }}
        env:
          PLAYWRIGHT_MODULE: /tmp/borderline-browser/node_modules/playwright
        run: node authoring/tools/suchraster-selbsttest.mjs site --ausgabe=dist/suchraster
      - name: Upload search grid result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: suchraster-${{ matrix.variante }}
          path: |
            dist/suchraster/**/ERGEBNIS.*
          if-no-files-found: ignore
  # N847-2: Neue oder geänderte Ausnahmen erlauben Verschlechterungen, die der Pull Request selbst begründet. Dieser Job
  # scheitert, sobald suchraster-ausnahmen.tsv gegenüber der Basis eine neue Zeile hat: Die Ausnahme braucht den Entscheid
  # von Christa Egger und eine Nachprüfung vor dem Merge. N855-2: Er scheitert auch bei jeder Änderung unter .github/,
  # weil der PR diesen Workflow selbst mitbringt. Änderungen an Werkzeug und Rasterdaten zeigt er an;
  # ändert sich interaktion.js ohne neue Proben, warnt er (N855-3).
  suchraster-ausnahmen:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check out base test data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: suchraster-basis
          sparse-checkout: |
            authoring/tools
            authoring/tests
            authoring/js
            .github
      - name: New exceptions and workflow changes need a decision and a review before merge
        run: |
          set -u
          zeilen() { grep -v -e '^#' -e '^Muster' -e '^[[:space:]]*$' "$1" 2>/dev/null | sort -u || true; }
          neu=$(diff <(zeilen suchraster-basis/authoring/tests/suchraster-ausnahmen.tsv) <(zeilen authoring/tests/suchraster-ausnahmen.tsv) | grep '^>' || true)
          geaendert=$(for f in authoring/tools/suchraster.mjs authoring/tools/suchraster-selbsttest.mjs authoring/tests/suchraster.json authoring/tests/suchraster-proben.txt authoring/tests/suche-ersttreffer.tsv authoring/tests/suche-ausbau-offen.tsv; do cmp -s "$f" "suchraster-basis/$f" || echo "$f"; done)
          workflow=$(diff -rq .github suchraster-basis/.github 2>&1 || true)
          proben_neu=$(for f in authoring/tests/suchraster.json authoring/tests/suchraster-proben.txt; do cmp -s "$f" "suchraster-basis/$f" || echo "$f"; done)
          js_neu=$(cmp -s authoring/js/interaktion.js suchraster-basis/authoring/js/interaktion.js || echo ja)
          {
            echo "### Ausnahmen und Rasterdaten"
            if [ -n "$geaendert" ]; then echo "Geändert gegenüber der Basis (eigenes Review nötig):"; echo "$geaendert" | sed 's/^/- /'; else echo "Werkzeug und Rasterdaten unverändert."; fi
            if [ -n "$neu" ]; then echo; echo "**Neue Ausnahmen: Entscheid von Christa Egger und Nachprüfung vor dem Merge nötig.**"; echo '```'; echo "$neu" | sed 's/^> //'; echo '```'; else echo; echo "Keine neue Ausnahme."; fi
            if [ -n "$workflow" ]; then echo; echo "**Unter .github/ geändert: Der PR bringt seinen eigenen Workflow mit. Eine grüne CI ist hier keine Freigabe nach R34-P01; Prüfung vor dem Merge nötig.**"; echo '```'; echo "$workflow"; echo '```'; else echo; echo "Unter .github/ unverändert."; fi
            if [ -n "$js_neu" ] && [ -z "$proben_neu" ]; then echo; echo "Hinweis: interaktion.js ist geändert, die Proben des Rasters nicht. Jede neue Suchregel bringt ihre Proben ins Raster mit (N855-3)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$js_neu" ] && [ -z "$proben_neu" ]; then echo "::warning::interaktion.js geändert, Proben des Suchrasters nicht (N855-3)"; fi
          fehler=0
          if [ -n "$neu" ]; then echo "Neue Ausnahmen in suchraster-ausnahmen.tsv:"; echo "$neu"; fehler=1; fi
          if [ -n "$workflow" ]; then echo "Unter .github/ gegenüber der Basis geändert (N855-2, N855-10):"; echo "$workflow"; fehler=1; fi
          [ "$fehler" = 0 ] && echo "Keine neue Ausnahme, nichts unter .github/ geändert."
          exit $fehler
